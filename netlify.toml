[build]
  command = "pnpm install && pnpm build"
  functions = "netlify/functions"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  included_files = []

[[redirects]]
  from = "/api/telegram/*"
  to = "/.netlify/functions/telegram-proxy"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
